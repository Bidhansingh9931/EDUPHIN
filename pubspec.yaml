name: eduphin
description: "Eduphin – Education & management application."
publish_to: 'none'

# 🔢 Change ONLY +number for every Play Store upload
version: 1.0.0+1

environment:
  # ✅ SAFE SDK RANGE (prevents build & Play Store issues)
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Animations & UI
  animated_text_kit: ^4.2.2
  simple_animations: ^5.0.2
  fl_chart: ^0.68.0
  dotted_border: ^2.1.0

  # Networking & Storage
  http: ^1.2.1
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  path: ^1.9.0

  # Files, Media & Permissions
  image_picker: ^1.0.4
  permission_handler: ^11.3.0
  file_picker: ^8.0.0+1
  open_file: ^3.3.2
  csv: ^5.1.1

  # Date & Time
  intl: ^0.19.0
  flutter_datetime_picker_plus: ^2.1.0

  # iOS icons support
  cupertino_icons: ^1.0.6

  # Font handling
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

# 🎯 App Icon (SAFE)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/app_icon.png
